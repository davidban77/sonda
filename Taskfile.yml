version: "3"

vars:
  COMPOSE_FILE: tests/e2e/docker-compose.yml
  SCENARIO_DIR: tests/e2e/scenarios

tasks:
  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    desc: Build the workspace (debug)
    cmds:
      - cargo build --workspace

  build:release:
    desc: Build sonda in release mode
    cmds:
      - cargo build --release -p sonda

  # ---------------------------------------------------------------------------
  # Test & Lint
  # ---------------------------------------------------------------------------
  test:
    desc: Run all unit and integration tests
    cmds:
      - cargo test --workspace

  lint:
    desc: Run clippy and format check
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo fmt --all -- --check

  check:
    desc: Run full quality gate (build + test + lint)
    cmds:
      - task: build
      - task: test
      - task: lint

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------
  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  audit:
    desc: Run cargo audit for security vulnerabilities
    cmds:
      - cargo audit

  docs:
    desc: Build and open Rust API documentation
    cmds:
      - cargo doc --workspace --no-deps --open

  fmt:
    desc: Auto-format all code
    cmds:
      - cargo fmt --all

  # ---------------------------------------------------------------------------
  # Documentation site
  # ---------------------------------------------------------------------------
  site:setup:
    desc: Install MkDocs Material in a local venv (uv-managed)
    cmds:
      - |
        echo "Using uv to create venv and install dependencies..."
        uv venv docs/site/.venv
        uv pip install -r docs/site/requirements.txt --python docs/site/.venv/bin/python
        echo ""
        echo "Done! Run 'task site:serve' to preview the docs locally."
    status:
      - test -f docs/site/.venv/bin/mkdocs

  site:build:
    desc: Build the MkDocs site (strict mode)
    deps: [site:setup]
    cmds:
      - docs/site/.venv/bin/mkdocs build --strict -f docs/site/mkdocs.yml

  site:serve:
    desc: Start local MkDocs dev server with live reload
    deps: [site:setup]
    cmds:
      - |
        echo "Docs site: http://localhost:8000"
        docs/site/.venv/bin/mkdocs serve -f docs/site/mkdocs.yml

  site:clean:
    desc: Remove the MkDocs build output and venv
    cmds:
      - rm -rf docs/site/site docs/site/.venv

  site:waveforms:
    desc: Regenerate the generator waveform SVGs embedded in the docs
    cmds:
      - cargo run -p sonda-core --example waveform_gallery

  site:wasm:
    desc: Rebuild the playground WebAssembly bundle (needs wasm-bindgen-cli matching Cargo.lock)
    summary: |
      Rebuilds docs/site/docs/javascripts/sonda_wasm{.js,_bg.wasm} from the
      sonda-wasm crate. Three things this recipe does that a plain cargo build
      does not, each load-bearing:

        * --profile wasm-release   size-tuned profile (see Cargo.toml). Worth
                                   ~3% after wasm-bindgen; most of the win is
                                   the wasm-opt step below.
        * RUSTFLAGS remaps         without these the bundle embeds the builder's
                                   absolute paths (/root/.cargo/..., the repo
                                   checkout), so the same source produces a
                                   different file on every machine and the drift
                                   gate cannot mean anything.
        * wasm-opt -Oz             binaryen's whole-module size pass. This is
                                   where the real reduction comes from: ~1.20 MB
                                   -> ~772 KB, about 35%. Not optional: the
                                   committed bundle IS optimized, so a rebuild
                                   without it is ~55% larger and trips the size
                                   gate. Install it first: apt-get install
                                   binaryen (or `brew install binaryen`) — but
                                   see the version note in the guard below,
                                   the distro package is usually too old.

      The whole build is staged in target/wasm-stage and moved into
      docs/site/docs/javascripts/ as the final command. The committed bundle is
      therefore never half-written: either the recipe completes and replaces it
      wholesale, or it fails and leaves it untouched.

      wasm-bindgen-cli must match the wasm-bindgen version in Cargo.lock
      (0.2.117), or the generated JS glue and the wasm will disagree.
    cmds:
      # FIRST, before anything writes anything. The guard used to sit on the
      # wasm-opt step, three commands in — by which point wasm-bindgen had
      # already written into docs/site/docs/javascripts/, so a "refused" run
      # left the committed bundle replaced by an unoptimized 1.2 MB one
      # (review #540 W2, measured: 771,488 -> 1,197,736 bytes). A guard that
      # fires after the damage is a diagnostic, not a guard.
      - |
        # The committed bundle is compared BYTE-FOR-BYTE against a rebuild by
        # the wasm-drift workflow, and that comparison is only meaningful if
        # everyone rebuilds under the same conditions the gate uses. Two
        # independent inputs change the output bytes (review #540 W1):
        #
        #   binaryen version   linux x86_64, 119   771,488 bytes  <- committed
        #                      macOS arm64,  131   770,922 bytes
        #   host platform      linux x86_64, 119   771,488 bytes  <- committed
        #                      macOS arm64,  119   772,019 bytes  (differ at byte 532)
        #
        # Each pair varies one axis; no run has ever measured linux x86_64 with
        # binaryen 131, so do not read a linux/131 figure out of the table.
        #
        # So this is an exact version match, not a floor, and the platform is
        # checked too. Getting either wrong produces a functionally correct
        # bundle that CI then rejects as drift — a confusing failure a long
        # way from its cause, which is exactly what this guard exists to
        # prevent. Rebuild on the reference platform, or let CI tell you the
        # bundle is stale and rebuild there.
        #
        # (Binaryen 108, the Debian/Ubuntu package, is a different and worse
        # trap: it optimizes without complaint and emits a module that dies in
        # the browser with "WebAssembly.Table.grow(): failed to grow table by
        # 4". Too old for what wasm-bindgen 0.2.117 emits.)
        want_binaryen=119
        want_platform="Linux x86_64"
        version=$(wasm-opt --version 2>/dev/null | grep -oE '[0-9]+' | head -1)
        platform="$(uname -s) $(uname -m)"
        if [ "${version:-0}" != "$want_binaryen" ] || [ "$platform" != "$want_platform" ]; then
          echo "ERROR: this host cannot produce the committed bundle." >&2
          echo "  binaryen: have ${version:-none}, need exactly $want_binaryen" >&2
          echo "  platform: have $platform, need $want_platform" >&2
          echo >&2
          echo "Both change the output bytes, and .github/workflows/wasm-drift.yml" >&2
          echo "compares the committed bundle byte-for-byte against a rebuild." >&2
          echo "A bundle built here would be functionally fine and still be" >&2
          echo "rejected as drift." >&2
          echo >&2
          echo "Nothing has been written — the committed bundle is untouched." >&2
          echo >&2
          echo "Binaryen releases: https://github.com/WebAssembly/binaryen/releases" >&2
          echo "To build anyway for local testing (do NOT commit the result):" >&2
          echo "  SONDA_WASM_ALLOW_HOST=1 task site:wasm" >&2
          [ "${SONDA_WASM_ALLOW_HOST:-}" = "1" ] || exit 1
          echo "SONDA_WASM_ALLOW_HOST=1 set — continuing; do not commit this bundle." >&2
        fi
      - rustup target add wasm32-unknown-unknown
      - |
        RUSTFLAGS="--remap-path-prefix $HOME/.cargo=/cargo --remap-path-prefix $(pwd)=/sonda" \
          cargo build -p sonda-wasm --profile wasm-release --target wasm32-unknown-unknown
      # Stage into target/, not into the docs tree. Mirrors what the drift
      # workflow does with /tmp/rebuilt, for the same reason: a build that
      # fails partway must not leave a broken bundle behind.
      - |
        rm -rf target/wasm-stage
        mkdir -p target/wasm-stage
        wasm-bindgen target/wasm32-unknown-unknown/wasm-release/sonda_wasm.wasm \
          --target web --no-typescript --out-dir target/wasm-stage
      - |
        staged=target/wasm-stage/sonda_wasm_bg.wasm
        if ! command -v wasm-opt >/dev/null 2>&1; then
          # Only reachable with SONDA_WASM_ALLOW_HOST=1; the guard rejects a
          # missing wasm-opt outright.
          echo "WARNING: wasm-opt not on PATH — this bundle is ~55% larger than" >&2
          echo "the committed one and will fail scripts/check_wasm_size.py." >&2
          exit 0
        fi
        version=$(wasm-opt --version | grep -oE '[0-9]+' | head -1)
        before=$(wc -c < "$staged")
        wasm-opt -Oz "$staged" -o "$staged.opt"
        mv "$staged.opt" "$staged"
        after=$(wc -c < "$staged")
        echo "wasm-opt -Oz (binaryen $version): $before -> $after bytes ($(( (before - after) * 100 / before ))% smaller)"
      # The only command that touches the committed bundle, and the last one
      # that can fail before it does.
      - |
        for f in sonda_wasm.js sonda_wasm_bg.wasm; do
          [ -f "target/wasm-stage/$f" ] || { echo "ERROR: staged $f missing; committed bundle left alone." >&2; exit 1; }
        done
        mv target/wasm-stage/sonda_wasm.js target/wasm-stage/sonda_wasm_bg.wasm docs/site/docs/javascripts/
        rm -rf target/wasm-stage
      - python3 scripts/check_wasm_size.py

  site:editor:
    desc: Rebuild the vendored CodeMirror bundle for the playground editor
    dir: docs/site/tools/editor
    cmds:
      - npm install
      - npm run build

  site:jstest:
    desc: Run the playground pure-helper JS tests (node, zero dependencies)
    cmds:
      - node docs/site/tools/tests/pure.test.mjs

  site:livegen-check:
    desc: Compile every live-widget slider combination through the real engine
    deps: [build:release]
    cmds:
      - SONDA_BIN=./target/release/sonda node docs/site/tools/tests/livegen-compile.mjs

  site:scenario-check:
    desc: Compile every runnable scenario fence in the docs through the real engine
    deps: [build:release]
    cmds:
      - python3 scripts/validate_docs_scenarios.py

  site:gallery-check:
    desc: Self-test the examples-gallery hook and prove the page it builds is deterministic
    summary: |
      test/examples.md is rewritten at build time by docs/site/hooks/
      examples_gallery.py, which reads every file named in the page's tables
      and emits a live card for each runnable one.

      Two things this checks that a normal build does not:

        * the hook's own unit tests, including the shared runnable-scenario
          case table it answers alongside sonda-pure.js and
          validate_docs_scenarios.py — three implementations of one rule, held
          together by one table;
        * determinism. The page is a build output; if two builds of unchanged
          sources differ, the hook has picked up something it should not have
          (directory order, a clock) and the next real diff is unreadable.

      The compile side — every carded example still compiling — lives in
      `task site:scenario-check`, because it needs the release binary.
    cmds:
      - python3 docs/site/hooks/examples_gallery.py --self-test
      - |
        mkdocs build --strict -f docs/site/mkdocs.yml
        cp docs/site/site/test/examples/index.html /tmp/sonda-gallery-1.html
        mkdocs build --strict -f docs/site/mkdocs.yml
        if cmp -s /tmp/sonda-gallery-1.html docs/site/site/test/examples/index.html; then
          echo "examples gallery: two builds byte-identical"
        else
          echo "ERROR: two builds of test/examples.md differ — the hook is not deterministic." >&2
          exit 1
        fi

  site:no-raw-html:
    desc: "Fail if any hand-written docs JS assigns raw markup (XSS floor)"
    cmds:
      - bash scripts/check_no_raw_html.sh

  site:smoke:
    desc: Drive the built docs site in Chromium (playground, alert lab, widgets, fences)
    summary: |
      Builds the site, serves it on :8777, and runs the browser smoke suite
      against it. Needs the npm deps once: cd docs/site/tools/browser && npm ci

      Set CHROMIUM_PATH to use a preinstalled browser instead of playwright's
      own download (this devcontainer has one at /opt/pw-browsers/chromium).

      Use this rather than copying the CI job's serve step: that one uses
      setsid, which is Linux-only, because each GitHub Actions `run` is a
      separate shell and the server has to outlive it. Here the server is a
      child of this recipe and is killed on exit, so it stays portable.
    cmds:
      - mkdocs build --strict -f docs/site/mkdocs.yml
      - |
        python3 -m http.server 8777 --directory docs/site/site >/dev/null 2>&1 &
        server=$!
        trap "kill $server 2>/dev/null" EXIT
        up=""
        for _ in $(seq 1 30); do
          if curl -sf -o /dev/null http://localhost:8777/playground/; then up=1; break; fi
          sleep 1
        done
        if [ -z "$up" ]; then
          echo "the site never came up on :8777 — is docs/site/site built?" >&2
          exit 1
        fi
        node docs/site/tools/browser/smoke.mjs

  # ---------------------------------------------------------------------------
  # E2E Stack
  # ---------------------------------------------------------------------------
  stack:up:
    desc: Start the observability stack (VM, Prometheus, vmagent, Grafana, Kafka, Loki)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d
      - echo ""
      - echo "Services:"
      - 'echo "  Grafana          http://localhost:3000  (admin/admin)"'
      - 'echo "  VictoriaMetrics  http://localhost:8428"'
      - 'echo "  Prometheus       http://localhost:9090"'
      - 'echo "  vmagent          http://localhost:8429"'
      - 'echo "  Kafka UI         http://localhost:8080"'
      - 'echo "  Kafka broker     localhost:9094  (external listener)"'
      - 'echo "  Loki             http://localhost:3100"'

  stack:down:
    desc: Stop and remove the observability stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v

  stack:logs:
    desc: Tail logs from all stack services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  stack:status:
    desc: Show status of stack services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  # ---------------------------------------------------------------------------
  # Run sonda against the stack
  # ---------------------------------------------------------------------------
  run:vm-prom:
    desc: Send Prometheus text metrics to VictoriaMetrics
    deps: [build:release]
    cmds:
      - ./target/release/sonda run {{.SCENARIO_DIR}}/vm-prometheus-text.yaml {{.CLI_ARGS}}

  run:vm-influx:
    desc: Send InfluxDB LP metrics to VictoriaMetrics
    deps: [build:release]
    cmds:
      - ./target/release/sonda run {{.SCENARIO_DIR}}/vm-influx-lp.yaml {{.CLI_ARGS}}

  run:kafka:
    desc: Send Prometheus text metrics to Kafka topic sonda-e2e-metrics
    deps: [build:release]
    cmds:
      - ./target/release/sonda run {{.SCENARIO_DIR}}/kafka-prometheus-text.yaml {{.CLI_ARGS}}

  run:loki:
    desc: Send log events to Loki (requires stack:up)
    deps: [build:release]
    cmds:
      - ./target/release/sonda run examples/loki-json-lines.yaml {{.CLI_ARGS}}

  run:constant:
    desc: Run a quick constant metric to stdout
    deps: [build:release]
    cmds:
      - ./target/release/sonda metrics --name up --rate 10 --duration 5s {{.CLI_ARGS}}

  run:sine:
    desc: Run a sine wave metric to stdout
    deps: [build:release]
    cmds:
      - |
        ./target/release/sonda metrics \
          --name cpu_usage \
          --rate 10 \
          --duration 10s \
          --value-mode sine \
          --amplitude 50 \
          --period-secs 10 \
          --offset 50 \
          --label host=dev-machine \
          {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # E2E Tests
  # ---------------------------------------------------------------------------
  e2e:
    desc: Run full e2e integration tests (starts/stops stack automatically)
    cmds:
      - bash tests/e2e/run.sh

  # ---------------------------------------------------------------------------
  # Convenience
  # ---------------------------------------------------------------------------
  demo:
    desc: Start stack, send metrics for 30s, then open Grafana
    cmds:
      - task: build:release
      - task: stack:up
      - echo ""
      - echo "Sending sine wave metrics to VictoriaMetrics for 30s..."
      - 'echo "Open Grafana at http://localhost:3000 and explore!"'
      - echo ""
      - ./target/release/sonda run {{.SCENARIO_DIR}}/demo.yaml
      - echo ""
      - 'echo "Done! Explore metrics in Grafana at http://localhost:3000"'
      - 'echo "Query: demo_sine_wave"'
