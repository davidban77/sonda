[package]
name = "sonda-server"
version = "1.26.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["web-programming::http-server", "development-tools::testing"]
description = "HTTP control plane for Sonda — synthetic telemetry generator"
readme = "../README.md"

[features]
default = ["config", "http"]
config = ["sonda-core/config", "sonda-core/strict-config"]
http = ["sonda-core/http"]
remote-write = ["sonda-core/remote-write"]
kafka = ["sonda-core/kafka"]
otlp = ["sonda-core/otlp"]
gnmi = ["sonda-core/gnmi", "dep:chrono"]

[[bin]]
name = "sonda-server"
path = "src/main.rs"

[dependencies]
sonda-core = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
libc = "0.2"
tempfile = "3"
insta = { workspace = true, features = ["filters", "redactions"] }
rstest = { workspace = true }
tonic = { version = "0.14", default-features = false }
prost = "0.14"
tokio-stream = { version = "0.1", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[lints]
workspace = true
