name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build, Test, Clippy, Fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: nextest

      - name: Build
        run: cargo build --workspace

      - name: Test (nextest)
        run: cargo nextest run --workspace

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  sonda-server:
    name: sonda-server Build & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Install nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: nextest

      - name: Build sonda-server
        run: cargo build -p sonda-server

      - name: Run sonda-server integration tests
        run: cargo nextest run -p sonda-server --test integration --no-capture
        timeout-minutes: 5

  docker-build:
    name: Docker Build (multi-arch verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  no-default-features:
    name: Test sonda-core without default features
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-no-default-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-no-default-

      - name: Install nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: nextest

      - name: Test without default features
        run: cargo nextest run -p sonda-core --no-default-features

      - name: Doctests without default features
        run: cargo test -p sonda-core --no-default-features --doc

      # `schema` implies `config` and nothing else. That is the whole claim of
      # the feature line, and `--all-features` cannot check it: there, every
      # other feature is on, so a hidden dependency on `runtime` (or on `http`,
      # via the verify module) would compile anyway and only surface for a
      # downstream consumer who enabled `schema` alone. The schema tests
      # themselves run in the all-features job — this step is about the
      # feature boundary, so it stops at building.
      - name: Build with `schema` as the only feature
        run: cargo build -p sonda-core --no-default-features --features schema

  all-features:
    name: Build, Test, Clippy (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-all-features-

      - name: Install nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: nextest

      - name: Build (all features)
        run: cargo build --workspace --all-features

      - name: Test (all features, nextest)
        run: cargo nextest run --workspace --all-features

      - name: Doctests (all features)
        run: cargo test --workspace --all-features --doc

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs-commands:
    name: Validate sonda commands in user-facing docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-commands-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-commands-

      # Build with the union of features used in any documented command so the
      # script's --dry-run invocations parse every example. Mirrors the feature
      # set on the all-features job but scoped to the sonda binary only.
      - name: Build sonda release
        run: cargo build --release -p sonda --features http,kafka,remote-write,otlp

      # Stdlib-only Python script — no requirements.txt, no pip install, no uv.
      # Uses the actions runner's default Python 3.
      - name: Validate documented sonda commands
        run: python3 scripts/validate_docs_commands.py

      # Every YAML fence the docs site offers a "Run in playground" button for
      # must actually compile, or the button is a promise the page cannot
      # keep. Same binary as above, so every documented sink/encoder parses.
      - name: Compile every runnable scenario fence in the docs
        run: python3 scripts/validate_docs_scenarios.py

      # The detector behind those buttons lives in JS (sonda-pure.js) and in
      # Python (the validator above). Both answer runnable-cases.json; this
      # proves the Python half agrees with the table the node harness pins.
      - name: Runnable-fence detector self-tests
        run: python3 scripts/validate_docs_scenarios.py --self-test

      - name: Examples-gallery hook self-tests
        run: python3 docs/site/hooks/examples_gallery.py --self-test

      # The drift workflow is path-filtered, so a record that has gone wrong
      # can sit unnoticed until the next change to sonda-core. This is cheap
      # and runs on every push.
      - name: Wasm bundle build pins are coherent
        run: |
          python3 scripts/wasm_pins.py --self-test
          python3 scripts/wasm_pins.py check

      # No backend, no accounts — text-to-HTML injection is the one classic
      # web risk left, and the codebase answer is a blanket rule. This is the
      # gate that keeps it a rule rather than a convention.
      - name: No raw-markup assignment in hand-written docs JS
        run: bash scripts/check_no_raw_html.sh

      # The wasm bundle downloads on every page carrying a live widget, so its
      # size is a user-facing property. Ratchet, not a ceiling to grow into.
      - name: Playground wasm bundle is within its size budget
        run: python3 scripts/check_wasm_size.py

      # sonda-editor.js is a committed BUILD OUTPUT. Nothing stops an edit to
      # tools/editor/src from being merged without the rebuilt bundle, leaving
      # the shipped editor silently behind its source — which is exactly the
      # state this gate found main in when it was written. esbuild's output is
      # deterministic from the lockfile, so a plain rebuild-and-diff is a
      # sound check.
      - name: Set up Node for the editor bundle check
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/tools/editor/package-lock.json

      # WHY THE BUILD IS NOT FULLY MINIFIED (and this gate can therefore mean
      # something). With `--minify`, esbuild allocates short identifier names
      # by frequency, and that allocation turned out not to be stable across
      # whatever varies between CI runs: the same commit, lockfile and source
      # passed this gate at 15:17 and failed it at 17:56 the same day, with
      # 336 differing bytes out of 365,254 — every one an identifier, size
      # identical, behaviour unchanged.
      #
      # Eliminated by measurement, none of them the cause: node (22.22.2,
      # 22.23.1 and 22.23.2 all produce identical bytes), npm (10.9.8 in both
      # runs), `npm ci` vs `npm install` (identical), fresh vs cached install
      # (four clean installs, identical), and esbuild's own parallelism
      # (GOMAXPROCS 1/2/4/8/16, identical). The culprit is still unnamed.
      #
      # So the fix does not pin a suspect — it removes the degree of freedom.
      # `--minify-whitespace --minify-syntax` keeps identifiers from the
      # source, so the only way these bytes can move is a real change to the
      # source or the dependencies, which is exactly what this gate is for.
      # The cost is 22 KB gzipped (120,166 -> 142,325) on the one page that
      # already loads a 771 KB wasm engine, and the bundle becomes readable
      # in devtools. The second incident on this gate bought that trade
      # (#540 found the first).
      - name: Editor bundle matches its source
        run: |
          cd docs/site/tools/editor
          npm ci
          # The last suspect the elimination pass above could not reach: the
          # esbuild binary itself. `@esbuild/*` ships a prebuilt executable per
          # platform, and npm resolves which one at install time, so a lockfile
          # match does not prove a binary match. Printed rather than asserted —
          # if this gate ever flakes again, the first question is whether these
          # digests differ between the green run and the red one, and that
          # question is only answerable if both runs recorded them.
          sha256sum node_modules/@esbuild/*/bin/esbuild || true
          npm run build
          cd - >/dev/null
          if ! git diff --exit-code -- docs/site/docs/javascripts/sonda-editor.js; then
            echo "::error::docs/site/docs/javascripts/sonda-editor.js does not match a" \
              "fresh build of docs/site/tools/editor/src. Run 'task site:editor' and" \
              "commit the result."
            exit 1
          fi

      # The drift gate above answers "is the bundle current"; it says nothing
      # about how big it is. The playground downloads this on every visit, so
      # weight is a user-facing property and deserves a ratchet — the same
      # argument WP5 made for the wasm bundle (review #548 M2).
      - name: Editor bundle size budget
        run: python3 scripts/check_editor_size.py

      # Zero-dependency node harness over the playground's pure JS helpers
      # (sonda-pure.js) — the only automated coverage the docs-site JS has.
      - name: Playground pure-helper tests
        run: node docs/site/tools/tests/pure.test.mjs

      # Every slider combination of the generators.md live widgets must
      # compile — the widget presets are pure data (livegen-presets.js),
      # and this feeds their corner/sweep grid through the binary built
      # above. Converts the presets' "ranges are compile-safe" comment
      # into a gate (review #534).
      - name: Live-widget slider combinations compile
        run: node docs/site/tools/tests/livegen-compile.mjs
        env:
          SONDA_BIN: ./target/release/sonda

      # The generator waveform SVGs on build/generators.md are a committed
      # build output of `sonda-core/examples/waveform_gallery.rs`, and until
      # now the only committed build output with no drift gate — the editor
      # bundle has one here, the wasm bundle has its own workflow, these had
      # nothing. A change to a generator's shape, or to the renderer, left the
      # published pictures showing the old curve with nothing to say so.
      #
      # Unlike the wasm bundle this needs no platform precondition — but the
      # reason is the ROUNDING, not the language (#567 r3 M2). The gallery
      # calls `.sin()`, `.ln()` and `.cos()`, whose last ULP is not guaranteed
      # identical across platforms and libm versions; every coordinate is then
      # emitted as `{:.1}`, which swamps a ULP difference by orders of
      # magnitude. Seeded RNGs (42, 7, 11) close the other degree of freedom.
      # If that precision is ever widened for smoother curves, this claim has
      # to be re-measured across hosts before it can be repeated.
      #
      # THE DELETION IS THE POINT. Regenerating over the top and diffing would
      # pass vacuously if the example ever stopped writing — no output, no
      # difference, green. Removing the files first makes the check depend on
      # the generator actually producing them: silence shows up as 13
      # deletions rather than as success.
      - name: Committed waveform SVGs match their generator
        run: |
          set -euo pipefail
          dir=docs/site/docs/build/img/generators

          # Assert the corpus exists BEFORE deleting it. `rm -f` succeeds on a
          # glob that matches nothing and git reports nothing for a path it
          # does not track, so a renamed directory would leave both halves of
          # this step green forever while checking nothing (#567 r3 M1) —
          # the same vacuous-pass shape the parity test already guards twice.
          # `|| true` because pipefail would otherwise kill the step on a
          # missing directory before the message below can explain why.
          before=$(find "$dir" -maxdepth 1 -name '*.svg' 2>/dev/null | wc -l || true)
          if [ "$before" -eq 0 ]; then
            echo "::error::no SVGs found under ${dir} — the directory moved or" \
              "the glob is wrong. Refusing to 'verify' an empty corpus."
            exit 1
          fi

          rm -f "$dir"/*.svg
          cargo run -q -p sonda-core --example waveform_gallery

          # `git status --porcelain`, not `git diff`: diff compares the worktree
          # to the index and so cannot see UNTRACKED files. Adding a 14th
          # generator, regenerating, and forgetting to `git add` the new SVG is
          # precisely the workflow this gate exists to protect, and it was
          # invisible to the diff form (#567 r3 W1).
          drift=$(git status --porcelain -- "$dir")
          if [ -n "$drift" ]; then
            echo "::error::the committed waveform SVGs do not match a fresh run of" \
              "the waveform_gallery example. Run 'task site:waveforms' and commit" \
              "the result. '??' means a generated file is not tracked at all;" \
              "' D' means the example did not write it."
            echo "$drift"
            exit 1
          fi

  # The docs site's JS is exercised here and nowhere else. The pure-helper
  # harness covers functions that are plain functions of their arguments; this
  # job covers what only a browser can: the wasm engine actually loading, the
  # canvas actually drawing, and the DOM wiring behaving under Material's
  # instant navigation. Before it existed, every visual claim in a docs PR
  # rested on the author having driven Chromium by hand — which a reviewer
  # cannot reproduce.
  docs-browser-smoke:
    name: Docs site browser smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/tools/browser/package-lock.json

      - name: Install smoke-suite dependencies
        working-directory: docs/site/tools/browser
        run: npm ci

      # Keyed on the resolved playwright version, so a lockfile bump fetches a
      # matching browser instead of silently reusing an incompatible cached one.
      - name: Resolve playwright version
        id: pw
        working-directory: docs/site/tools/browser
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        working-directory: docs/site/tools/browser
        run: npx playwright install --with-deps chromium

      # Same major and pin as the deploy workflow, so the site this job smokes
      # is built by the toolchain that actually publishes it.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt

      - name: Build the site
        run: mkdocs build --strict -f docs/site/mkdocs.yml

      # test/examples.md is generated at build time by a hook that reads 60
      # files off disk. A hook that depends on directory order, a dict's
      # iteration or a timestamp would produce a page that changes without
      # its sources changing — invisible in one build, and a diff nobody can
      # explain in the next. Two builds, byte-compared, is the cheapest way to
      # keep that honest, and it costs one extra mkdocs run on a job that is
      # already installing mkdocs.
      - name: The generated examples gallery is deterministic
        run: |
          cp docs/site/site/test/examples/index.html /tmp/gallery-1.html
          mkdocs build --strict -f docs/site/mkdocs.yml
          if ! cmp -s /tmp/gallery-1.html docs/site/site/test/examples/index.html; then
            echo "::error::two builds of test/examples.md differ — the gallery hook is not deterministic."
            diff <(head -c 4000 /tmp/gallery-1.html) \
                 <(head -c 4000 docs/site/site/test/examples/index.html) || true
            exit 1
          fi
          echo "two builds byte-identical"

      # Served as static files, exactly as GitHub Pages serves it — the wasm
      # needs a real HTTP origin, so file:// is not an option.
      # nohup + setsid so the server outlives this step's shell — each `run`
      # is its own shell, and the next step needs the port still open. setsid
      # is Linux-only and this runner is ubuntu; for local runs use
      # `task site:smoke`, whose recipe is portable, rather than copying this.
      - name: Serve the built site
        run: |
          setsid nohup python3 -m http.server 8777 --directory docs/site/site \
            > /tmp/http-server.log 2>&1 < /dev/null &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8777/playground/; then
              echo "site is up on :8777"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the site never came up on :8777"
          cat /tmp/http-server.log
          exit 1

      - name: Browser smoke suite
        working-directory: docs/site/tools/browser
        run: node smoke.mjs
        env:
          SONDA_SITE_URL: http://localhost:8777

  release-pin-check:
    name: release.yml rust-toolchain pin matches rust-toolchain.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Belt-and-braces guard against the `dtolnay/rust-toolchain@<X>` pin in
      # release.yml drifting away from rust-toolchain.toml's `channel`.
      # Dependabot has bumped this action twice (PRs #302, #443), both times
      # requesting a nonexistent Rust release because the action's tag IS the
      # toolchain version it installs. Dependabot is now configured to ignore
      # the action; this check catches the next failure mode (a human edits
      # one file but forgets the other).
      - name: Verify release.yml pin matches rust-toolchain.toml
        run: |
          pinned=$(grep -oE 'dtolnay/rust-toolchain@[0-9.]+' .github/workflows/release.yml | head -1 | cut -d@ -f2)
          expected=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$pinned" != "$expected" ]; then
            echo "::error::release.yml pins dtolnay/rust-toolchain@${pinned} but rust-toolchain.toml channel is ${expected}. Bump both together."
            exit 1
          fi
          echo "OK: both pinned to ${pinned}"

  action-contract:
    name: sonda-action contract (argv safety + release resolution)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately NOT path-filtered, unlike the live self-test. These are
    # seconds of shell and Python with no containers, and they guard the
    # two things a broken action would leak quietly: a workflow input
    # reaching a shell, and a moving tag resolving to the wrong release.
    # Cheap enough to run on every PR, so they do.
    #
    # No step here touches the network. A floor-staleness probe used to,
    # and it did its job: it went red on v1.21.0, the release that shipped
    # `--alertmanager-url` and so made the constant a settled fact. With
    # nothing left to ask it would have reddened every future PR in the
    # repo, so it was removed rather than muted.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Argv construction under hostile inputs (spaces, ;, $(…), globs,
      # newlines), plus drift checks asserting action.yml and release.yml
      # still contain the constructions the harness exercises.
      - name: Action argv safety
        run: bash scripts/tests/action_argv_test.sh

      # Tag -> concrete release resolution: major-tag selection, the
      # release-please no-assets window, missing checksums, version floors.
      - name: Release resolver unit tests
        run: python3 scripts/resolve_release.py --self-test
