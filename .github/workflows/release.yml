name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_name: macos-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Match the version pinned in rust-toolchain.toml. Using `@stable` installs
        # rust-std for the matrix target under the "stable" rustup install, but
        # rust-toolchain.toml then activates the "1.95.0" install (a separate
        # rustup name) which does not have the target std — surfacing as
        # `error[E0463]: can't find crate for core`. Bumping rust-toolchain.toml
        # requires bumping this version too.
        #
        # DO NOT let Dependabot bump this. The `dtolnay/rust-toolchain` action's
        # tag IS the Rust toolchain version it installs — `@1.100.0` would request
        # a nonexistent Rust release. Dependabot is configured to ignore this
        # action (see .github/dependabot.yml) for exactly this reason.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build binaries (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Build binaries (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          TARBALL="sonda-${VERSION}-${TARGET}.tar.gz"

          # Copy binaries to a staging directory
          mkdir -p staging
          cp "target/${TARGET}/release/sonda" staging/
          cp "target/${TARGET}/release/sonda-server" staging/

          # Create the tarball
          tar czf "${TARBALL}" -C staging sonda sonda-server
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Needed by the major-tag step below: this job otherwise never checks
      # the repo out, so there would be no git to tag with.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The major-tag step compares this release against every existing
          # vN.* tag, so it needs them all — a shallow checkout has none.
          fetch-depth: 0

      - name: Download all tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum sonda-*.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Installation

            **Quick install (Linux/macOS):**
            ```
            curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Pin a specific version:**
            ```
            SONDA_VERSION=${{ github.ref_name }} curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Docker:**
            ```
            docker pull ghcr.io/davidban77/sonda:${{ github.ref_name }}
            ```

            See the [README](https://github.com/davidban77/sonda#installation) for all installation methods.
          files: |
            sonda-*.tar.gz
            SHA256SUMS

      # Actions users pin `uses: davidban77/sonda@v1` and expect it to track
      # the newest 1.x. That only works if a `v1` tag is moved onto each
      # release — GitHub does not maintain major tags for you.
      #
      # Runs after the release is published, so `v1` only ever points at a
      # tag whose assets exist. Moving it earlier would make `@v1` resolve
      # to a release the installer cannot download yet.
      #
      # Guarded three ways, because a major tag that moves when it should
      # not is worse than one that never moves: pre-releases are skipped,
      # non-`vX.Y.Z` tags are skipped, and the tag moved is derived from
      # THIS release's own major — so cutting v2.0.0 creates/moves `v2` and
      # leaves `v1` pointing where it was, for everyone still pinned to it.
      - name: Move the major-version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "note: ${RELEASE_TAG} is not a plain vX.Y.Z tag; leaving major tags untouched"
            exit 0
          fi
          major="${RELEASE_TAG%%.*}"          # v1.20.0 -> v1

          # Never move the major tag BACKWARDS. A patch backported onto an
          # older line — 1.19.1 cut after 1.20.0 — is a normal thing to do
          # precisely once a newer line exists, and moving `v1` onto it
          # would silently downgrade everyone pinned to `@v1`
          # (#554 review W3). Compare by version, not by what was released
          # most recently, and not as strings (v1.9.0 > v1.20.0 as text).
          highest="$(git tag -l "${major}.*" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          if [ -n "$highest" ] && [ "$highest" != "$RELEASE_TAG" ]; then
            echo "note: ${highest} is newer than ${RELEASE_TAG}; leaving ${major} where it is"
            exit 0
          fi

          echo "moving ${major} to ${RELEASE_TAG} ($(git rev-parse --short HEAD))"
          git tag -f "$major"
          git push --force origin "refs/tags/${major}"
          echo "${major} now points at ${RELEASE_TAG}"

  docker:
    name: Build & Push Multi-arch Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
