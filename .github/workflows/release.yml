name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild the container image for a tag that is already released, without
  # re-cutting the release. Only the `docker` job runs on this path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to rebuild the image for (e.g. v1.22.3)"
        required: true
        type: string

concurrency:
  # `github.ref_name`, not `github.ref`: the dispatch input is a bare tag, so
  # `github.ref` would group the same release as `release-refs/tags/v1.22.3`
  # on the tag push and `release-v1.22.3` on the dispatch — two runs pushing
  # the same image tags at once, neither yielding.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    # workflow_dispatch exists only to rebuild the image, so the matrix and the
    # release itself stay on the tag-push path.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_name: macos-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Match the version pinned in rust-toolchain.toml. Using `@stable` installs
        # rust-std for the matrix target under the "stable" rustup install, but
        # rust-toolchain.toml then activates the "1.95.0" install (a separate
        # rustup name) which does not have the target std — surfacing as
        # `error[E0463]: can't find crate for core`. Bumping rust-toolchain.toml
        # requires bumping this version too.
        #
        # DO NOT let Dependabot bump this. The `dtolnay/rust-toolchain` action's
        # tag IS the Rust toolchain version it installs — `@1.100.0` would request
        # a nonexistent Rust release. Dependabot is configured to ignore this
        # action (see .github/dependabot.yml) for exactly this reason.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build binaries (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Build binaries (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          TARBALL="sonda-${VERSION}-${TARGET}.tar.gz"

          # Copy binaries to a staging directory
          mkdir -p staging
          cp "target/${TARGET}/release/sonda" staging/
          cp "target/${TARGET}/release/sonda-server" staging/

          # Create the tarball
          tar czf "${TARBALL}" -C staging sonda sonda-server
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Needed by the major-tag step below: this job otherwise never checks
      # the repo out, so there would be no git to tag with.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The major-tag step compares this release against every existing
          # vN.* tag, so it needs them all — a shallow checkout has none.
          fetch-depth: 0

      - name: Download all tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum sonda-*.tar.gz > SHA256SUMS

      # The image tags carry no `v`: scripts/image_tags.sh publishes 1.22.3
      # from v1.22.3. Notes that spell the reference a second time here
      # advertise a pull that 404s, so they read the answer off the script
      # that creates the tags.
      - name: Resolve the image reference the notes advertise
        id: image_ref
        run: |
          set -euo pipefail
          refs="$(bash scripts/image_tags.sh "$GITHUB_REF_NAME" "${REGISTRY}/${IMAGE_NAME}")"
          # The exact version, which every release publishes. The rest of the
          # list moves, and may already point at a newer release than this one.
          printf 'ref=%s\n' "${refs%%$'\n'*}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Installation

            **Quick install (Linux/macOS):**
            ```
            curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Pin a specific version:**
            ```
            SONDA_VERSION=${{ github.ref_name }} curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Docker:**
            ```
            docker pull ${{ steps.image_ref.outputs.ref }}
            ```

            See the [README](https://github.com/davidban77/sonda#installation) for all installation methods.
          files: |
            sonda-*.tar.gz
            SHA256SUMS

      # Actions users pin `uses: davidban77/sonda@v1` and expect it to track
      # the newest 1.x. That only works if a `v1` tag is moved onto each
      # release — GitHub does not maintain major tags for you.
      #
      # Runs after the release is published, so `v1` only ever points at a
      # tag whose assets exist. Moving it earlier would make `@v1` resolve
      # to a release the installer cannot download yet.
      #
      # Guarded three ways, because a major tag that moves when it should
      # not is worse than one that never moves: pre-releases are skipped,
      # non-`vX.Y.Z` tags are skipped, and the tag moved is derived from
      # THIS release's own major — so cutting v2.0.0 creates/moves `v2` and
      # leaves `v1` pointing where it was, for everyone still pinned to it.
      - name: Move the major-version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "note: ${RELEASE_TAG} is not a plain vX.Y.Z tag; leaving major tags untouched"
            exit 0
          fi
          major="${RELEASE_TAG%%.*}"          # v1.20.0 -> v1

          # Never move the major tag BACKWARDS. A patch backported onto an
          # older line — 1.19.1 cut after 1.20.0 — is a normal thing to do
          # precisely once a newer line exists, and moving `v1` onto it
          # would silently downgrade everyone pinned to `@v1`
          # (#554 review W3). Compare by version, not by what was released
          # most recently, and not as strings (v1.9.0 > v1.20.0 as text).
          highest="$(git tag -l "${major}.*" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          if [ -n "$highest" ] && [ "$highest" != "$RELEASE_TAG" ]; then
            echo "note: ${highest} is newer than ${RELEASE_TAG}; leaving ${major} where it is"
            exit 0
          fi

          echo "moving ${major} to ${RELEASE_TAG} ($(git rev-parse --short HEAD))"
          git tag -f "$major"
          git push --force origin "refs/tags/${major}"
          echo "${major} now points at ${RELEASE_TAG}"

  # The image ships the binaries the release published, byte for byte. It does
  # not compile them again: the `binaries` matrix already produced static musl
  # builds for both architectures, and rebuilding them inside buildx meant one
  # leg compiling the whole workspace under QEMU (45 minutes and still going,
  # on v1.22.3).
  #
  # `needs: [release]` rather than `[binaries]` because the tarballs are pulled
  # from the published release. The upload artifacts carry `retention-days: 1`,
  # so a dispatched rebuild of an older tag could not read them; using the
  # release assets means the dispatch path and the tag-push path are the same
  # code, exercised on every release.
  #
  # The push is by digest and the tags are created last, so every check below
  # runs against a manifest nothing can resolve by name yet. A check that runs
  # after the tags exist detects a bad image; it does not stop one shipping.
  docker:
    name: Build & Push Multi-arch Docker Image
    needs: [release]
    # `release` is skipped on workflow_dispatch, and a skipped dependency skips
    # the dependent unless a status function is used here.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # scripts/moving_tags.sh compares this tag against every existing
          # vX.Y.Z and refuses outright if it cannot see this one; a shallow
          # checkout has none of them.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `labels` is the only output read. The tag list is this repository's
      # own — scripts/image_tags.sh, applied after verification — because
      # metadata-action's `flavor` defaults to `latest=auto`, under which
      # `:latest` is appended by the semver processor from the first tag entry
      # rather than by a `type=raw,value=latest` entry. `enable=` on that entry
      # can only suppress the duplicate, so a backported release would publish
      # `:latest` anyway. Not reading `steps.meta.outputs.tags` leaves that
      # behaviour with nothing to act on.
      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Sets org.opencontainers.image.version. `value:` is explicit
          # because type=semver otherwise reads the git ref, which on a
          # workflow_dispatch is a branch, not a tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}

      - name: Download the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir assets \
            --pattern "sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            --pattern "sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" \
            --pattern "SHA256SUMS"
          ls -l assets

      # The release publishes SHA256SUMS as an asset. Anchoring to it is what
      # makes the image-vs-tarball comparison later mean something: without it
      # both sides of that comparison would come from the same download.
      - name: Verify the tarballs against the release SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          for tarball in \
            "sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz"; do
            if ! grep -qE "^[0-9a-f]{64}  ${tarball}\$" SHA256SUMS; then
              echo "::error::${tarball} is not listed in the release SHA256SUMS for ${RELEASE_TAG}"
              exit 1
            fi
          done
          sha256sum --check --strict --ignore-missing SHA256SUMS

      - name: Unpack the released binaries into the build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          tar xzf "assets/sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" -C dist/amd64
          tar xzf "assets/sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" -C dist/arm64

          # A tarball unpacked into the wrong dist/<arch>/ is the one wrong-image
          # fault nothing downstream can see: the image would still match dist/
          # exactly, and the binary would still start, because a kernel executes
          # an ELF by its own header rather than by the platform its container
          # claims. Read the header. e_machine sits at offset 18; 3e00 is x86-64,
          # b700 is AArch64.
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) expected=3e00 ;;
              arm64) expected=b700 ;;
            esac
            for binary in sonda sonda-server; do
              machine="$(od -An -tx1 -j18 -N2 "dist/${arch}/${binary}" | tr -d ' ')"
              if [ "$machine" != "$expected" ]; then
                echo "::error::dist/${arch}/${binary} is ELF machine ${machine}, expected ${expected} for linux/${arch}"
                exit 1
              fi
            done
          done
          ls -l dist/amd64 dist/arm64

      # `push-by-digest=true` uploads the manifest without naming it, so this
      # step publishes nothing anyone can pull by tag. Everything downstream
      # addresses the digest; the tags are created in the last step of the job.
      #
      # No gha cache. This build compiles nothing — it copies two binaries into
      # a scratch image — and the prebuilt layer's cache key is the binary
      # content digest, which is different every release, so a hit is not
      # possible. `mode=max` would still write tens of megabytes of
      # never-reusable entries per release into the repository-wide cache that
      # docker-build.yml depends on, where they evict entries that do get hits.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_SOURCE=prebuilt
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Chains to the SHA256SUMS check above: those binaries came from the
      # release, and these are the same bytes. Exact equality per file per
      # platform, because "close enough" has no meaning for a binary — a
      # mismatch means a wrong-arch dist/ layout, a stale cache layer, or a
      # COPY reading the wrong path, and any of them ships the wrong image.
      - name: Verify the image ships the released binaries
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull --quiet --platform "linux/${arch}" "$IMAGE" > /dev/null
            container="$(docker create --platform "linux/${arch}" "$IMAGE")"
            for binary in sonda sonda-server; do
              docker cp "${container}:/${binary}" "extracted-${arch}-${binary}"
              released="$(sha256sum "dist/${arch}/${binary}" | cut -d' ' -f1)"
              shipped="$(sha256sum "extracted-${arch}-${binary}" | cut -d' ' -f1)"
              if [ "$shipped" != "$released" ]; then
                echo "::error::linux/${arch}: /${binary} in the image is ${shipped}, the released binary is ${released}"
                exit 1
              fi
              echo "linux/${arch} /${binary}: ${shipped} matches the released binary"
            done
            docker rm "$container" > /dev/null
            # The digest names a manifest list, and the image store holds one
            # platform per digest: without this the arm64 leg fails to pull
            # with "cannot overwrite digest".
            docker rmi "$IMAGE" > /dev/null
          done

      # Both binaries, both platforms. `sonda-server` is the ENTRYPOINT and
      # `/sonda` needs --entrypoint because the image has no shell; asserting
      # on the version catches a binary that starts but is not the one this
      # tag released.
      - name: Smoke test the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            docker pull --quiet --platform "linux/${arch}" "$IMAGE" > /dev/null
            for binary in sonda sonda-server; do
              reported="$(docker run --rm --platform "linux/${arch}" --entrypoint "/${binary}" "$IMAGE" --version)"
              echo "linux/${arch} /${binary}: ${reported}"
              case "$reported" in
                *"$version"*) ;;
                *)
                  echo "::error::linux/${arch}: /${binary} --version reported '${reported}', expected it to contain ${version}"
                  exit 1
                  ;;
              esac
            done
            docker rmi "$IMAGE" > /dev/null
          done

      # Last, and only now: until this step the manifest has no name, so a
      # failure anywhere above leaves nothing to untag. Which tags a release
      # may claim is scripts/image_tags.sh's answer — the exact version
      # always, the moving ones only where they would not go backwards.
      - name: Tag the verified image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          refs="$(bash scripts/image_tags.sh "$RELEASE_TAG" "$IMAGE")"
          if [ -z "$refs" ]; then
            echo "::error::no image tags were computed for ${RELEASE_TAG}"
            exit 1
          fi
          args=()
          while IFS= read -r ref; do args+=(--tag "$ref"); done <<< "$refs"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          printf '%s\n' "$refs"
