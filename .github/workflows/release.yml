name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild the container image for a tag that is already released, without
  # re-cutting the release. Only the `docker` job runs on this path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag to rebuild the image for (e.g. v1.22.3)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    # workflow_dispatch exists only to rebuild the image, so the matrix and the
    # release itself stay on the tag-push path.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset_name: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_name: macos-amd64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # Match the version pinned in rust-toolchain.toml. Using `@stable` installs
        # rust-std for the matrix target under the "stable" rustup install, but
        # rust-toolchain.toml then activates the "1.95.0" install (a separate
        # rustup name) which does not have the target std — surfacing as
        # `error[E0463]: can't find crate for core`. Bumping rust-toolchain.toml
        # requires bumping this version too.
        #
        # DO NOT let Dependabot bump this. The `dtolnay/rust-toolchain` action's
        # tag IS the Rust toolchain version it installs — `@1.100.0` would request
        # a nonexistent Rust release. Dependabot is configured to ignore this
        # action (see .github/dependabot.yml) for exactly this reason.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build binaries (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cargo build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Build binaries (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda
          cross build --release --target ${{ matrix.target }} --features remote-write,kafka -p sonda-server

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          TARBALL="sonda-${VERSION}-${TARGET}.tar.gz"

          # Copy binaries to a staging directory
          mkdir -p staging
          cp "target/${TARGET}/release/sonda" staging/
          cp "target/${TARGET}/release/sonda-server" staging/

          # Create the tarball
          tar czf "${TARBALL}" -C staging sonda sonda-server
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Needed by the major-tag step below: this job otherwise never checks
      # the repo out, so there would be no git to tag with.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The major-tag step compares this release against every existing
          # vN.* tag, so it needs them all — a shallow checkout has none.
          fetch-depth: 0

      - name: Download all tarball artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum sonda-*.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Installation

            **Quick install (Linux/macOS):**
            ```
            curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Pin a specific version:**
            ```
            SONDA_VERSION=${{ github.ref_name }} curl -fsSL https://raw.githubusercontent.com/davidban77/sonda/main/install.sh | sh
            ```

            **Docker:**
            ```
            docker pull ghcr.io/davidban77/sonda:${{ github.ref_name }}
            ```

            See the [README](https://github.com/davidban77/sonda#installation) for all installation methods.
          files: |
            sonda-*.tar.gz
            SHA256SUMS

      # Actions users pin `uses: davidban77/sonda@v1` and expect it to track
      # the newest 1.x. That only works if a `v1` tag is moved onto each
      # release — GitHub does not maintain major tags for you.
      #
      # Runs after the release is published, so `v1` only ever points at a
      # tag whose assets exist. Moving it earlier would make `@v1` resolve
      # to a release the installer cannot download yet.
      #
      # Whether `v1` may move at all is decided by scripts/moving_tags.sh,
      # which the image-tag guard in the `docker` job also calls: a major tag
      # that moves when it should not silently downgrades everyone pinned to
      # it, and two copies of that rule is one copy too many. The tag moved is
      # derived from THIS release's own major — so cutting v2.0.0 creates or
      # moves `v2` and leaves `v1` pointing where it was.
      - name: Move the major-version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${RELEASE_TAG%%.*}"          # v1.20.0 -> v1
          # Matched without a pipe: a reader that exits on the first match
          # (`grep -q`) leaves the script killed by SIGPIPE, which pipefail
          # then reads as "do not move" on exactly the releases that should.
          decisions="$(bash scripts/moving_tags.sh "$RELEASE_TAG")"
          case "$decisions" in
            *MOVE_MAJOR=true*) ;;
            *)
              echo "note: leaving ${major} where it is"
              exit 0
              ;;
          esac

          echo "moving ${major} to ${RELEASE_TAG} ($(git rev-parse --short HEAD))"
          git tag -f "$major"
          git push --force origin "refs/tags/${major}"
          echo "${major} now points at ${RELEASE_TAG}"

  # The image ships the binaries the release published, byte for byte. It does
  # not compile them again: the `binaries` matrix already produced static musl
  # builds for both architectures, and rebuilding them inside buildx meant one
  # leg compiling the whole workspace under QEMU (45 minutes and still going,
  # on v1.22.3).
  #
  # `needs: [release]` rather than `[binaries]` because the tarballs are pulled
  # from the published release. The upload artifacts carry `retention-days: 1`,
  # so a dispatched rebuild of an older tag could not read them; using the
  # release assets means the dispatch path and the tag-push path are the same
  # code, exercised on every release.
  docker:
    name: Build & Push Multi-arch Docker Image
    needs: [release]
    # `release` is skipped on workflow_dispatch, and a skipped dependency skips
    # the dependent unless a status function is used here.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The moving-tag guard below compares this tag against every existing
          # vX.Y.Z; a shallow checkout has none of them.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same hazard, same rule, same script as the "Move the major-version tag"
      # step above (#554 review W3): rebuilding an older tag must not drag
      # `latest`, `{{major}}` or `{{major}}.{{minor}}` backwards onto it. The
      # dispatch input makes that reachable, so the guard is required, not
      # decorative.
      - name: Decide which moving tags may apply
        run: |
          set -euo pipefail
          bash scripts/moving_tags.sh "$RELEASE_TAG" | tee -a "$GITHUB_ENV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `value:` is explicit because type=semver otherwise reads the git
          # ref, which on a workflow_dispatch is a branch, not a tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ env.MOVE_MINOR == 'true' }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ env.MOVE_MAJOR == 'true' }}
            type=raw,value=latest,enable=${{ env.MOVE_LATEST == 'true' }}

      - name: Download the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir assets \
            --pattern "sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            --pattern "sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" \
            --pattern "SHA256SUMS"
          ls -l assets

      # The release publishes SHA256SUMS as an asset. Anchoring to it is what
      # makes the image-vs-tarball comparison later mean something: without it
      # both sides of that comparison would come from the same download.
      - name: Verify the tarballs against the release SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          for tarball in \
            "sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            "sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz"; do
            if ! grep -qE "^[0-9a-f]{64}  ${tarball}\$" SHA256SUMS; then
              echo "::error::${tarball} is not listed in the release SHA256SUMS for ${RELEASE_TAG}"
              exit 1
            fi
          done
          sha256sum --check --strict --ignore-missing SHA256SUMS

      - name: Unpack the released binaries into the build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          tar xzf "assets/sonda-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" -C dist/amd64
          tar xzf "assets/sonda-${RELEASE_TAG}-aarch64-unknown-linux-musl.tar.gz" -C dist/arm64

          # A tarball unpacked into the wrong dist/<arch>/ is the one wrong-image
          # fault nothing downstream can see: the image would still match dist/
          # exactly, and the binary would still start, because a kernel executes
          # an ELF by its own header rather than by the platform its container
          # claims. Read the header. e_machine sits at offset 18; 3e00 is x86-64,
          # b700 is AArch64.
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) expected=3e00 ;;
              arm64) expected=b700 ;;
            esac
            for binary in sonda sonda-server; do
              machine="$(od -An -tx1 -j18 -N2 "dist/${arch}/${binary}" | tr -d ' ')"
              if [ "$machine" != "$expected" ]; then
                echo "::error::dist/${arch}/${binary} is ELF machine ${machine}, expected ${expected} for linux/${arch}"
                exit 1
              fi
            done
          done
          ls -l dist/amd64 dist/arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SOURCE=prebuilt
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chains to the SHA256SUMS check above: those binaries came from the
      # release, and these are the same bytes. Exact equality per file per
      # platform, because "close enough" has no meaning for a binary — a
      # mismatch means a wrong-arch dist/ layout, a stale cache layer, or a
      # COPY reading the wrong path, and any of them ships the wrong image.
      - name: Verify the pushed image ships the released binaries
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull --quiet --platform "linux/${arch}" "$IMAGE" > /dev/null
            container="$(docker create --platform "linux/${arch}" "$IMAGE")"
            for binary in sonda sonda-server; do
              docker cp "${container}:/${binary}" "extracted-${arch}-${binary}"
              released="$(sha256sum "dist/${arch}/${binary}" | cut -d' ' -f1)"
              shipped="$(sha256sum "extracted-${arch}-${binary}" | cut -d' ' -f1)"
              if [ "$shipped" != "$released" ]; then
                echo "::error::linux/${arch}: /${binary} in the image is ${shipped}, the released binary is ${released}"
                exit 1
              fi
              echo "linux/${arch} /${binary}: ${shipped} matches the released binary"
            done
            docker rm "$container" > /dev/null
          done

      # ENTRYPOINT is /sonda-server and the image has no shell, so reaching the
      # other binary needs --entrypoint. Asserting on the version catches a
      # binary that starts but is not the one this tag released.
      - name: Smoke test the pushed image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            reported="$(docker run --rm --platform "linux/${arch}" --entrypoint /sonda "$IMAGE" --version)"
            echo "linux/${arch}: ${reported}"
            case "$reported" in
              *"$version"*) ;;
              *)
                echo "::error::linux/${arch}: sonda --version reported '${reported}', expected it to contain ${version}"
                exit 1
                ;;
            esac
          done
