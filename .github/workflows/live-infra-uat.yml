# Informational gate — failures show in PR checks but do not block merge.
# Promote to required after measured stability (2-4 weeks of green runs).
#
# Runs the e2e coverage matrix from docs/site/docs/guides/e2e-testing.md
# against live container backends. Catches the bug class the dry-run
# docs-drift catcher cannot: did the encoder/sink actually deliver data
# to the backend image we're pinned to?
#
# Local equivalent (assumes Docker is up + sonda is built):
#   python3 scripts/live_infra_uat.py

name: Live Infra UAT

# Path-filtered on pull requests, unconditional on main. At ~10 minutes it was
# 29% of a full CI pass and ran on every PR, including docs-only ones that
# cannot change its answer. Leaving main unfiltered means drift still surfaces
# within one merge rather than waiting for the next code PR.
#
# The list is the harness's real inputs, derived from the script rather than
# guessed: it builds `-p sonda` (so all of sonda-core and sonda, plus the
# workspace manifests and toolchain pin), boots the compose stack from
# examples/ (which mounts ../docker/ for Grafana provisioning), and runs
# scenarios from examples/ and tests/e2e/.
#
# Deliberately NOT listed: docs/site/docs/guides/e2e-testing.md. The matrix is
# hardcoded in live_infra_uat.py and that page is a hand-maintained parallel
# copy, so editing the page cannot change what this job does.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    paths:
      - 'sonda-core/**'
      - 'sonda/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'examples/**'
      - 'docker/**'
      - 'tests/e2e/**'
      - 'scripts/live_infra_uat.py'
      - '.github/workflows/live-infra-uat.yml'
  workflow_dispatch:

concurrency:
  group: live-infra-uat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live-infra-uat:
    name: Live Infra UAT (e2e matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-infra-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-live-infra-

      # Union of features required across every matrix row. Mirrors the
      # docs-commands job's pattern so feature drift between gates is loud.
      - name: Build sonda release
        run: cargo build --release -p sonda --features http,kafka,remote-write,otlp

      # Stdlib-only Python harness — no requirements.txt, no pip install.
      - name: Run live-infra UAT harness
        run: python3 scripts/live_infra_uat.py

      # Best-effort: dump container logs for post-mortem when the harness
      # fails. The harness already attaches per-row log tails to stderr,
      # but full logs uploaded as an artifact are easier to read in the UI.
      - name: Collect compose logs (on failure)
        if: failure()
        run: |
          mkdir -p compose-logs
          docker compose -f examples/docker-compose-victoriametrics.yml \
            --profile loki --profile otel-collector --profile prometheus \
            --profile alerting \
            ps > compose-logs/ps.txt 2>&1 || true
          for svc in victoriametrics vmagent prometheus loki otel-collector vmalert alertmanager; do
            docker compose -f examples/docker-compose-victoriametrics.yml \
              --profile loki --profile otel-collector --profile prometheus \
              --profile alerting \
              logs --no-color --tail 500 "$svc" \
              > "compose-logs/${svc}.log" 2>&1 || true
          done

      - name: Upload compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs/
          retention-days: 7
          if-no-files-found: ignore
