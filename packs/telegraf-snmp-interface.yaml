# Telegraf SNMP interface metrics pack.
#
# Models the standard interface metrics collected by the Telegraf SNMP
# input plugin. Metric names and label keys match the Telegraf-normalized
# schema exactly, so sonda output can replace real device telemetry in
# dashboards and alert rules.
#
# Each metric carries an `snmp:` hint with its IF-MIB column and SNMP type,
# indexed by the ifIndex label, so a scenario that encodes this pack with the
# snmp encoder needs no `oids:` or `types:` of its own:
#
#   encoder: { type: snmp, drop_labels: [ifName, ifAlias, job] }
#
# Entries the scenario's encoder block does write in `oids:` or `types:` win
# over the hints. Under any other encoder the hints are not used.
#
# ifOperStatus is an enum code: 1 up, 2 down.

version: 2
kind: composable
name: telegraf_snmp_interface
description: "Standard SNMP interface metrics (Telegraf-normalized)"
category: network

shared_labels:
  device: ""
  ifName: ""
  ifAlias: ""
  ifIndex: ""
  job: snmp

metrics:
  - name: ifOperStatus
    generator:
      type: constant
      value: 1.0
    snmp:
      oid: "1.3.6.1.2.1.2.2.1.8.{ifIndex}"
      type: integer

  - name: ifHCInOctets
    generator:
      type: step
      start: 0.0
      step_size: 125000.0
    snmp:
      oid: "1.3.6.1.2.1.31.1.1.1.6.{ifIndex}"
      type: counter64

  - name: ifHCOutOctets
    generator:
      type: step
      start: 0.0
      step_size: 62500.0
    snmp:
      oid: "1.3.6.1.2.1.31.1.1.1.10.{ifIndex}"
      type: counter64

  - name: ifInErrors
    generator:
      type: constant
      value: 0.0
    snmp:
      oid: "1.3.6.1.2.1.2.2.1.14.{ifIndex}"
      type: counter32

  - name: ifOutErrors
    generator:
      type: constant
      value: 0.0
    snmp:
      oid: "1.3.6.1.2.1.2.2.1.20.{ifIndex}"
      type: counter32
