[package]
name = "sonda-core"
version = "1.22.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools::testing"]
description = "Core engine for Sonda — synthetic telemetry generation library"
readme = "../README.md"

[features]
default = ["config", "runtime", "strict-config"]
# `packs` and `catalog` are not feature-gated: the compiler cannot resolve
# `pack:` without them, so there is no build that wants one and not the other.
# The cost is on record because it is now the bundle's largest growth term —
# pack extension added +31,904 bytes after `wasm-opt` (780,467 -> 812,371,
# 37,629 left of the 850,000 budget), almost all of it the `Deviation` and
# `DeviationReplace` deserializers, the second of which embeds the whole
# `GeneratorConfig` enum. sonda-wasm builds an empty `InMemoryPackResolver`,
# so none of it is reachable in the browser today. If the budget needs
# relief, gating `packs` is the lever and `strict-config` below is the
# precedent for how to split and measure one.
config = ["dep:serde_yaml_ng", "dep:chrono", "chrono/serde"]
# Rejecting unknown YAML keys. Split from `config` rather than folded into it
# because `serde_ignored` monomorphizes the whole ScenarioFile deserialize tree
# a second time: measured at +349,758 bytes of wasm before `wasm-opt` and
# +170,669 after, 22% on a bundle every docs visitor downloads. The binaries
# turn it on; sonda-wasm deliberately does not. See compiler/parse.rs.
strict-config = ["config", "dep:serde_ignored"]
# The async scheduling and delivery layer (tokio). Disable for pure-engine
# consumers — e.g. compiling generators/encoders/compiler to WebAssembly.
runtime = ["dep:tokio", "dep:tokio-util"]
# chrono: the Alertmanager acquisition parses RFC 3339 alert stamps and the
# RFC 7231 `Date` header it measures the server clock from. Already a
# dependency of the default `config` feature — no new supply chain.
http = ["dep:ureq", "dep:chrono", "runtime"]
kafka = ["dep:rskafka", "dep:chrono", "chrono/clock", "dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "runtime"]
remote-write = ["dep:prost", "dep:snap", "dep:ureq", "runtime"]
otlp = ["dep:tonic", "dep:prost", "dep:bytes", "dep:http", "runtime"]
# JSON Schema for the scenario config types. Implies `config`: schemars
# reads the `#[serde(...)]` attributes to know the WIRE shape, and those
# attributes are themselves behind the config feature.
schema = ["config", "dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
serde_ignored = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
async-trait = "0.1"
ureq = { workspace = true, optional = true }
rskafka = { version = "0.6.0", default-features = false, features = ["transport-tls"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "time", "macros", "fs", "io-std", "io-util"], optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
webpki-roots = { version = "1", optional = true }
prost = { version = "0.14", optional = true }
snap = { version = "1", optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "channel", "tls-ring"], optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
insta = { workspace = true, features = ["filters"] }
rstest = { workspace = true }
criterion = { version = "0.8", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tracing-test = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
jsonschema = { version = "0.52.0", default-features = false }

[[example]]
name = "waveform_gallery"
required-features = ["config"]

[[example]]
name = "scenario_schema"
required-features = ["schema"]

[[bench]]
name = "while_steady_state"
harness = false

[[bench]]
name = "scheduler_baseline"
harness = false

[lints]
workspace = true
