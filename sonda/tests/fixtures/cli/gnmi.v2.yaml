version: 2
kind: runnable

defaults:
  rate: 1
  duration: 5s
  encoder:
    type: gnmi
    origin: openconfig-interfaces
    path: "/interfaces/interface[name={ifName}]/state/counters/{name}"
    values:
      in_octets: uint

scenarios:
  - signal_type: metrics
    name: in_octets
    generator:
      type: step
      start: 0
      step_size: 125000
    labels:
      device: rtr-core-01
      ifName: GigabitEthernet0/0/0
