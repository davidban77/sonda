[package]
name = "sonda"
version = "1.21.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools::testing"]
description = "CLI for Sonda — synthetic telemetry generator for testing observability pipelines"
readme = "../README.md"

[features]
default = ["config", "http"]
config = ["sonda-core/config"]
http = ["sonda-core/http", "dep:chrono"]
remote-write = ["sonda-core/remote-write"]
kafka = ["sonda-core/kafka"]
otlp = ["sonda-core/otlp"]

[[bin]]
name = "sonda"
path = "src/main.rs"

[dependencies]
sonda-core = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
ctrlc = "3"
owo-colors = { version = "4", features = ["supports-colors"] }
serde_json = { workspace = true }
dialoguer = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7", default-features = false }
# Only the `--from-prometheus` capture path parses RFC 3339 window bounds, and
# that path is behind `http`.
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile = "3"
# The mock Alertmanager stamps alerts (RFC 3339) and its own Date header
# (RFC 7231), both of which the acquisition layer parses for real.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
insta = { workspace = true, features = ["filters"] }
rstest = { workspace = true }

[lints]
workspace = true
