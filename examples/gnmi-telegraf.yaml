# A router with four interfaces, served as a gNMI target for Telegraf.
#
# Sonda listens on 0.0.0.0:57400. Telegraf's inputs.gnmi plugin is the
# client: it dials Sonda, subscribes to the interface counters and
# oper-status, and writes what it receives to its outputs.
# examples/telegraf/telegraf.conf is the matching Telegraf config.
#
# Prerequisites (for the Telegraf side):
#   docker compose -f examples/docker-compose-victoriametrics.yml --profile gnmi up -d
#
# Usage (runs until stopped; release binaries include the gnmi feature):
#   sonda run examples/gnmi-telegraf.yaml
#
# Inspect the target directly with gnmic:
#   gnmic -a 127.0.0.1:57400 --insecure subscribe --path /interfaces --mode once
#
# Verify what Telegraf wrote to VictoriaMetrics:
#   curl -s 'http://localhost:8428/api/v1/series' \
#     --data-urlencode 'match[]={__name__=~"ifcounters_.*|ifstate_.*"}'
#
# sonda:static - a gnmi_target listens for a client, which the browser playground cannot provide

version: 2
kind: runnable

defaults:
  rate: 1
  encoder:
    type: gnmi
    origin: openconfig-interfaces
    target_label: device
    path: "/interfaces/interface[name={ifName}]/state/counters/{name}"
    values:
      in_octets: uint
      out_octets: uint
      oper_status:
        enum: { 1: UP, 2: DOWN }
    paths:
      oper_status: "/interfaces/interface[name={ifName}]/state/oper-status"
  sink:
    type: gnmi_target
    listen: 0.0.0.0:57400

scenarios:
  # --- GigabitEthernet0/0/0: the uplink that flaps ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 125000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 62500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 60s
      down_duration: 5s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  # --- GigabitEthernet0/0/1 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 100000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 50000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 300s
      down_duration: 10s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  # --- GigabitEthernet0/0/2 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 25000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 12500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 600s
      down_duration: 30s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  # --- GigabitEthernet0/0/3 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 5000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 2500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 900s
      down_duration: 60s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }
