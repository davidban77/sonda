# A router with four interfaces, served as an SNMPv1, SNMPv2c and SNMPv3
# agent for Telegraf.
#
# Sonda listens on UDP 0.0.0.0:1161. Telegraf's inputs.snmp plugin is the
# poller: it reads sysUpTime and walks the interface table with GETBULK over
# SNMPv2c, walks it again with GETNEXT over SNMPv1, a third time over SNMPv3
# as the user telegraf (authPriv: HMAC-SHA-256 and AES-128), and writes what
# it reads to its outputs. SNMPv1 has no Counter64, so the v1 walk skips the
# ifHCInOctets and ifHCOutOctets columns. examples/telegraf/telegraf-snmp.conf
# is the matching Telegraf config. The second v3 user, monitor, reads at
# authNoPriv. The v3 passwords are lab values; the agent's engine boots are 1
# on every run, and its engine ID is made from the host name and the bound
# address, so it is the same after a restart.
#
# The telegraf_snmp_interface pack carries each metric's IF-MIB column and
# SNMP type, and serves the ifName and ifAlias labels as ifXTable columns, so
# the encoder block names no OIDs. Interface 1's ifOperStatus flaps: up for
# 60s, down for 5s.
#
# Prerequisites (for the Telegraf side):
#   docker compose -f examples/docker-compose-victoriametrics.yml --profile snmp up -d
#
# Usage (runs until stopped; release binaries include the snmp feature):
#   sonda run examples/snmp-telegraf.yaml
#
# Walk the agent directly with net-snmp:
#   snmpbulkwalk -v2c -c public -On 127.0.0.1:1161 1.3.6.1.2.1
#   snmpwalk -v1 -c public -On 127.0.0.1:1161 1.3.6.1.2.1
#   snmpget -v3 -l authPriv -u telegraf -a SHA-256 -A lab-only-v3-password \
#     -x AES -X lab-only-v3-privacy -On 127.0.0.1:1161 1.3.6.1.2.1.1.5.0
#   snmpget -v3 -l authNoPriv -u monitor -a SHA-256 -A lab-only-v3-password \
#     -On 127.0.0.1:1161 1.3.6.1.2.1.1.5.0
#
# Verify what Telegraf wrote to VictoriaMetrics:
#   curl -s 'http://localhost:8428/api/v1/series' \
#     --data-urlencode 'match[]={__name__=~"interface_.*|snmp_.*"}'
#
# sonda:static - an snmp_agent listens for a poller, which the browser playground cannot provide

version: 2
kind: runnable

defaults:
  rate: 1
  encoder:
    type: snmp
    # The agent serves no OID for this label, so it is dropped.
    drop_labels: [job]
  sink:
    type: snmp_agent
    listen: 0.0.0.0:1161
    community: public
    versions: [v1, v2c, v3]
    users:
      - name: telegraf
        auth: { protocol: sha256, password: lab-only-v3-password }
        priv: { protocol: aes128, password: lab-only-v3-privacy }
      - name: monitor
        auth: { protocol: sha256, password: lab-only-v3-password }
    system:
      name: rtr-core-01
      descr: Sonda synthetic router
      contact: noc@example.com
      location: lab-1

scenarios:
  - signal_type: metrics
    pack: telegraf_snmp_interface
    labels: { device: rtr-core-01, ifIndex: 1, ifName: GigabitEthernet0/0/0 }
    overrides:
      ifOperStatus:
        generator:
          type: flap
          up_duration: 60s
          down_duration: 5s
          enum: oper_state

  - signal_type: metrics
    pack: telegraf_snmp_interface
    labels: { device: rtr-core-01, ifIndex: 2, ifName: GigabitEthernet0/0/1 }

  - signal_type: metrics
    pack: telegraf_snmp_interface
    labels: { device: rtr-core-01, ifIndex: 3, ifName: GigabitEthernet0/0/2 }

  - signal_type: metrics
    pack: telegraf_snmp_interface
    labels: { device: rtr-core-01, ifIndex: 4, ifName: GigabitEthernet0/0/3 }
