# Example: using a metric pack in a scenario file.
#
# When `sonda run` encounters a v2 entry with a `pack:` field, it expands the
# pack into one metric scenario per metric in the pack.
#
# This example uses the `telegraf_snmp_interface` pack with user labels for
# a specific device and interface.
#
# Run with:
#   sonda run examples/pack-scenario.yaml
#
# `telegraf_snmp_interface` is a builtin pack, embedded in the binary, so no
# `--catalog` is needed. Pass `--catalog <dir>` to override it with your own
# pack of the same name.

version: 2
kind: runnable

defaults:
  rate: 1
  duration: 10s
  encoder:
    type: prometheus_text
  sink:
    type: stdout

scenarios:
  - signal_type: metrics
    pack: telegraf_snmp_interface
    labels:
      device: rtr-edge-01
      ifName: GigabitEthernet0/0/0
      ifAlias: "Uplink to Core"
      ifIndex: "1"
