# Telegraf as the SNMP poller of a 24-port switch, in the interface-table
# layout of Telegraf's inputs.snmp documentation.
#
# Pairs with examples/if-mib-switch.yaml. Every 2s Telegraf reads ifNumber
# and walks the interface table with GETBULK over SNMPv2c: one row per
# interface, tagged with its ifDescr, carrying the ifTable and ifXTable
# columns that hold numbers as fields, and writes what it reads to
# VictoriaMetrics over the InfluxDB line protocol. The documentation names
# the columns through IF-MIB; this image has no MIB files, so every OID is
# numeric and each column is listed.
#
# The `telegraf-if-mib` service (profile `snmp`) in
# examples/docker-compose-victoriametrics.yml mounts this file. Sonda runs on
# the host; the service maps the name `sonda` to it, and Telegraf tags every
# metric with that name as `source`.

[agent]
  # Two polls or more land in each 5s down window of the flapping ports.
  interval = "2s"
  flush_interval = "5s"
  omit_hostname = true

# The alias names the input in Telegraf's log lines ("E! [inputs.snmp::if_mib]").
[[inputs.snmp]]
  alias = "if_mib"
  agents = ["udp://sonda:1163"]
  version = 2
  community = "public"
  timeout = "5s"
  retries = 3
  max_repetitions = 10
  agent_host_tag = "source"

  # snmp_ifNumber: the number of interfaces (IF-MIB::ifNumber.0).
  [[inputs.snmp.field]]
    name = "ifNumber"
    oid = ".1.3.6.1.2.1.2.1.0"

  # interface_<field>, one series per interface, tagged with its ifDescr.
  [[inputs.snmp.table]]
    name = "interface"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = ".1.3.6.1.2.1.2.2.1.2"
      is_tag = true

    # ifTable.
    [[inputs.snmp.table.field]]
      name = "ifIndex"
      oid = ".1.3.6.1.2.1.2.2.1.1"

    [[inputs.snmp.table.field]]
      name = "ifType"
      oid = ".1.3.6.1.2.1.2.2.1.3"

    [[inputs.snmp.table.field]]
      name = "ifSpeed"
      oid = ".1.3.6.1.2.1.2.2.1.5"

    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = ".1.3.6.1.2.1.2.2.1.7"

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = ".1.3.6.1.2.1.2.2.1.10"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = ".1.3.6.1.2.1.2.2.1.16"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

    # ifXTable: the 64-bit octet counters and the speed in Mb/s.
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "ifHighSpeed"
      oid = ".1.3.6.1.2.1.31.1.1.1.15"

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  skip_database_creation = true

# Answers 200 at http://<host>:8098/ while Telegraf is running.
[[outputs.health]]
  service_address = "http://:8098"
