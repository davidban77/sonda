# Telegraf as the SNMP poller of Sonda's snmp_agent sink.
#
# Pairs with examples/snmp-telegraf.yaml. Every 2s Telegraf reads sysUpTime
# and sysName, walks the interface table with GETBULK over SNMPv2c, tagging
# each interface with its ifName and ifAlias, walks it again with GETNEXT over
# SNMPv1 as interface_v1, reads sysUpTime and walks the table a third time
# over SNMPv3 (authPriv, HMAC-SHA-256 and AES-128, as the user telegraf) as
# snmp_v3 and interface_v3, and writes what it read to VictoriaMetrics over
# the InfluxDB line protocol. SNMPv1 has no Counter64, so interface_v1 carries no
# ifHCInOctets or ifHCOutOctets. Every OID is numeric, so Telegraf loads no
# MIB and needs no translator.
#
# The `telegraf-snmp` service (profile `snmp`) in
# examples/docker-compose-victoriametrics.yml mounts this file. Sonda runs on
# the host; the service maps the name `sonda` to it, and Telegraf tags every
# metric with that name as `source`.

[agent]
  # Two polls or more land in each 5s down window of interface 1's flap.
  # Every input polls on the clock's multiples of it (round_interval, the
  # default), so the live UAT can restart sonda between two polls.
  interval = "2s"
  flush_interval = "5s"
  omit_hostname = true

# Each block's alias names it in Telegraf's log lines ("E! [inputs.snmp::v2c]").
[[inputs.snmp]]
  alias = "v2c"
  agents = ["udp://sonda:1161"]
  version = 2
  community = "public"
  timeout = "5s"
  retries = 3
  max_repetitions = 10
  agent_host_tag = "source"

  # snmp_uptime: hundredths of a second since the agent started.
  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = ".1.3.6.1.2.1.1.5.0"
    is_tag = true

  # interface_<field>, one series per interface, tagged index="<ifIndex>"
  # and with the interface's ifName and ifAlias (an empty one is no tag).
  [[inputs.snmp.table]]
    name = "interface"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

# The same interface table over SNMPv1: interface_v1_<field>, tagged
# index="<ifIndex>" and with the interface's ifName and ifAlias. The agent
# skips Counter64 instances for a v1 poller, so the two HC columns read as
# empty and no field is written for them.
[[inputs.snmp]]
  alias = "v1"
  agents = ["udp://sonda:1161"]
  version = 1
  community = "public"
  timeout = "5s"
  retries = 3
  agent_host_tag = "source"

  [[inputs.snmp.table]]
    name = "interface_v1"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

# The same interface table over SNMPv3 at authPriv: interface_v3_<field>,
# tagged index="<ifIndex>" and with the interface's ifName and ifAlias, and
# snmp_v3_uptime. The user and passwords are the example's lab values; the
# agent answers the engine discovery and the time window gosnmp goes through.
[[inputs.snmp]]
  alias = "v3"
  # The measurement of the top-level fields, so this input's uptime is a
  # series of its own: snmp_v3_uptime.
  name = "snmp_v3"
  agents = ["udp://sonda:1161"]
  version = 3
  sec_level = "authPriv"
  sec_name = "telegraf"
  auth_protocol = "SHA256"
  auth_password = "lab-only-v3-password"
  priv_protocol = "AES"
  priv_password = "lab-only-v3-privacy"
  timeout = "5s"
  retries = 3
  max_repetitions = 10
  agent_host_tag = "source"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.table]]
    name = "interface_v3"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = ".1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = ".1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = ".1.3.6.1.2.1.2.2.1.8"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = ".1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = ".1.3.6.1.2.1.2.2.1.20"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = ".1.3.6.1.2.1.31.1.1.1.10"

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  skip_database_creation = true

# Answers 200 at http://<host>:8097/ while Telegraf is running.
[[outputs.health]]
  service_address = "http://:8097"
