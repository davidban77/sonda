# The live UAT's addition to telegraf-snmp.conf, mounted only by the compose
# telegraf-snmp service, under /etc/telegraf/telegraf.d/. Telegraf has no
# log level that reaches into another file's input, so this is an input of its
# own: it reads sysUpTime over SNMPv3 as the v3 block's user, writes nothing
# (namedrop), and logs gosnmp's trace, whose out-of-time-window and
# unknown-engine-id warnings the UAT reads around a restart of sonda.
[[inputs.snmp]]
  alias = "v3_trace"
  log_level = "trace"
  namedrop = ["*"]
  agents = ["udp://sonda:1161"]
  version = 3
  sec_level = "authPriv"
  sec_name = "telegraf"
  auth_protocol = "SHA256"
  auth_password = "lab-only-v3-password"
  priv_protocol = "AES"
  priv_password = "lab-only-v3-privacy"
  timeout = "5s"
  retries = 3
  agent_host_tag = "source"

  [[inputs.snmp.field]]
    name = "uptime"
    oid = ".1.3.6.1.2.1.1.3.0"
