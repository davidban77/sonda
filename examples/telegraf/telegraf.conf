# Telegraf as the gNMI client of Sonda's gnmi_target sink.
#
# Pairs with examples/gnmi-telegraf.yaml. Telegraf dials the target,
# subscribes to the interface counters and oper-status, and writes every
# update to VictoriaMetrics over the InfluxDB line protocol.
#
# The `telegraf` service (profile `gnmi`) in
# examples/docker-compose-victoriametrics.yml mounts this file. Sonda runs on
# the host; the service maps the name `sonda` to it, and Telegraf tags every
# metric with that name as `source`.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  # Logs "Connection to gNMI device sonda:57400 established" once the
  # subscription request is sent.
  debug = true

[[inputs.gnmi]]
  addresses = ["sonda:57400"]
  encoding = "proto"
  redial = "10s"

  [[inputs.gnmi.subscription]]
    name = "ifcounters"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  # Sent when the oper-status changes, and every 30s while it holds.
  [[inputs.gnmi.subscription]]
    name = "ifstate"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "on_change"
    heartbeat_interval = "30s"

# VictoriaMetrics stores numbers only, so the openconfig oper-status strings
# are written as their enum codes: UP = 1, DOWN = 2.
[[processors.enum]]
  [[processors.enum.mapping]]
    fields = ["oper_status"]
    [processors.enum.mapping.value_mappings]
      UP = 1
      DOWN = 2

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  skip_database_creation = true

# Answers 200 at http://<host>:8095/ while Telegraf is running.
[[outputs.health]]
  service_address = "http://:8095"
