# Telegraf as the gNMI client of Sonda's gnmi_target sink, over TLS and
# with a username and password.
#
# Pairs with examples/gnmi-telegraf-tls.yaml. The same subscriptions as
# telegraf.conf, against sonda:57401: Telegraf verifies the target's
# certificate against the CA in /etc/telegraf/certs/ca.pem and sends the
# credentials as gRPC metadata on every RPC.
#
# The `telegraf-tls` service (profile `gnmi-tls`) in
# examples/docker-compose-victoriametrics.yml mounts this file and
# examples/telegraf/certs/. Sonda runs on the host; the service maps the name
# `sonda` to it, and Telegraf tags every metric with that name as `source`.
#
# Unlike telegraf.conf, this client asks for JSON_IETF, so it receives every
# value as RFC 7951 JSON text. The counters arrive as JSON strings, which
# Telegraf writes as string fields and VictoriaMetrics stores as numbers.

# Tags every metric, so this client's samples are told apart from those of
# telegraf.conf, which share `source="sonda"`.
[global_tags]
  gnmi_row = "tls"

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  # Logs "Connection to gNMI device sonda:57401 established" once the
  # subscription request is sent.
  debug = true

[[inputs.gnmi]]
  addresses = ["sonda:57401"]
  encoding = "json_ietf"
  redial = "10s"
  tls_enable = true
  tls_ca = "/etc/telegraf/certs/ca.pem"
  # The example password of gnmi-telegraf-tls.yaml.
  username = "sonda"
  password = "sonda-uat"

  [[inputs.gnmi.subscription]]
    name = "ifcounters"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

  # Sent when the oper-status changes, and every 30s while it holds.
  [[inputs.gnmi.subscription]]
    name = "ifstate"
    origin = "openconfig-interfaces"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "on_change"
    heartbeat_interval = "30s"

# VictoriaMetrics stores numbers only, so the openconfig oper-status strings
# are written as their enum codes: UP = 1, DOWN = 2.
[[processors.enum]]
  [[processors.enum.mapping]]
    fields = ["oper_status"]
    [processors.enum.mapping.value_mappings]
      UP = 1
      DOWN = 2

[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  skip_database_creation = true

# Answers 200 at http://<host>:8096/ while Telegraf is running.
[[outputs.health]]
  service_address = "http://:8096"
