# The router of gnmi-telegraf.yaml, served over TLS and behind a username
# and password, for a Telegraf that connects with `tls_enable = true`.
#
# Sonda listens on 0.0.0.0:57401. Every connection is TLS, from the server
# certificate and key below, and every RPC must carry the gRPC metadata
# `username: sonda` and `password: sonda-uat`. `sonda-uat` is an example
# password for this local stack; use your own anywhere else.
# examples/telegraf/telegraf-tls.conf is the matching Telegraf config.
#
# The certificates are not committed. Make a CA and a server certificate for
# the names Telegraf and gnmic dial (python3 scripts/live_infra_uat.py makes
# the same files before it starts the stack):
#   mkdir -p examples/telegraf/certs && cd examples/telegraf/certs
#   openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=sonda-uat-ca \
#     -keyout ca-key.pem -out ca.pem
#   openssl req -newkey rsa:2048 -nodes -subj /CN=sonda \
#     -keyout server-key.pem -out server.csr
#   openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -days 1 \
#     -extfile <(printf 'subjectAltName=DNS:sonda,DNS:localhost,IP:127.0.0.1') \
#     -out server.pem
#
# Prerequisites (for the Telegraf side):
#   docker compose -f examples/docker-compose-victoriametrics.yml --profile gnmi-tls up -d
#
# Usage, from the repository root (the certificate paths are relative to it):
#   sonda run examples/gnmi-telegraf-tls.yaml
#
# Inspect the target directly with gnmic:
#   gnmic -a 127.0.0.1:57401 --tls-ca examples/telegraf/certs/ca.pem \
#     -u sonda -p sonda-uat subscribe --path /interfaces --mode once
#
# sonda:static - a gnmi_target listens for a client, which the browser playground cannot provide

version: 2
kind: runnable

defaults:
  rate: 1
  encoder:
    type: gnmi
    origin: openconfig-interfaces
    target_label: device
    path: "/interfaces/interface[name={ifName}]/state/counters/{name}"
    values:
      in_octets: uint
      out_octets: uint
      oper_status:
        enum: { 1: UP, 2: DOWN }
    paths:
      oper_status: "/interfaces/interface[name={ifName}]/state/oper-status"
  sink:
    type: gnmi_target
    listen: 0.0.0.0:57401
    tls:
      cert: examples/telegraf/certs/server.pem
      key: examples/telegraf/certs/server-key.pem
    credentials:
      username: sonda
      password: "sonda-uat"

scenarios:
  # --- GigabitEthernet0/0/0: the uplink that flaps ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 125000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 62500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 60s
      down_duration: 5s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/0 }

  # --- GigabitEthernet0/0/1 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 100000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 50000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 300s
      down_duration: 10s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/1 }

  # --- GigabitEthernet0/0/2 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 25000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 12500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 600s
      down_duration: 30s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/2 }

  # --- GigabitEthernet0/0/3 ---
  - signal_type: metrics
    name: in_octets
    generator: { type: step, start: 0, step_size: 5000 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }

  - signal_type: metrics
    name: out_octets
    generator: { type: step, start: 0, step_size: 2500 }
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }

  - signal_type: metrics
    name: oper_status
    generator:
      type: flap
      up_duration: 900s
      down_duration: 60s
      enum: oper_state
    labels: { device: rtr-core-01, ifName: GigabitEthernet0/0/3 }
