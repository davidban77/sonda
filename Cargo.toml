[workspace]
members = ["sonda-core", "sonda", "sonda-server", "sonda-wasm"]
resolver = "2"

# Size-optimized build for the WebAssembly facade only; native binaries keep
# the workspace default release profile.
[profile.release.package.sonda-wasm]
opt-level = "z"

[workspace.package]
version = "1.19.0"
edition = "2021"
rust-version = "1.75"
authors = ["David Flores <davidflores77@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidban77/sonda"
homepage = "https://github.com/davidban77/sonda"
description = "Synthetic telemetry generator for testing observability pipelines"
keywords = ["telemetry", "metrics", "observability", "testing", "synthetic"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
sonda-core = { path = "sonda-core", version = "1.19.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
insta = { version = "1.40", features = ["json", "yaml"] }
rstest = "0.26"

[workspace.lints.clippy]
# Holding a std::sync lock across an .await deadlocks the runtime.
await_holding_lock = "deny"
