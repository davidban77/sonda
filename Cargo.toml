[workspace]
members = ["sonda-core", "sonda", "sonda-server", "sonda-wasm"]
resolver = "2"

# Size-optimized build for the WebAssembly facade only; native binaries keep
# the workspace default release profile.
[profile.release.package.sonda-wasm]
opt-level = "z"

# The profile the committed playground bundle is built with (`task site:wasm`).
#
# Kept separate from `release` rather than tightening `release` itself, because
# every one of these settings trades compile time or debuggability for bytes —
# a bargain worth taking for a file every docs visitor downloads, and a bad one
# for the native binaries and the test suite.
#
# The package override above only reaches sonda-wasm's OWN code; setting
# opt-level here reaches its dependencies too, which is where most of the
# bundle actually comes from. `lto = "fat"` lets the linker drop across crate
# boundaries, `codegen-units = 1` removes the parallelism that blocks those
# cross-unit optimizations, and stripping debuginfo drops symbol tables no
# browser reads. Artifacts land in target/wasm32-unknown-unknown/wasm-release/.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[workspace.package]
version = "1.22.3"
edition = "2021"
rust-version = "1.75"
authors = ["David Flores <davidflores77@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidban77/sonda"
homepage = "https://github.com/davidban77/sonda"
description = "Synthetic telemetry generator for testing observability pipelines"
keywords = ["telemetry", "metrics", "observability", "testing", "synthetic"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
sonda-core = { path = "sonda-core", version = "1.22.3" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_ignored = "0.1"
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ureq = { version = "2", default-features = false, features = ["tls"] }
insta = { version = "1.40", features = ["json", "yaml"] }
rstest = "0.26"

[workspace.lints.clippy]
# Holding a std::sync lock across an .await deadlocks the runtime.
await_holding_lock = "deny"
